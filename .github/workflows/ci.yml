name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U anchor -d anchor"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    # The name is a required status check on main; it lints and formats too (#106).
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  smoke:
    name: Browser smoke suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up --build -d --wait
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run smoke
        working-directory: frontend
        env:
          ANCHOR_BASE_URL: http://localhost
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to the box
    # Push-to-main only (a PR stops at the test jobs above); the host gate keeps
    # main green until the box from #24's errands exists.
    if: github.event_name == 'push' && vars.ANCHOR_DEPLOY_HOST != ''
    needs: [backend, frontend, smoke]
    # One deploy at a time. Two merges landing seconds apart used to rsync conflicting
    # .env files and race their `docker compose up`, so whichever landed last decided
    # what served, and their image prunes collided and reddened a deploy that had
    # already shipped (#107).
    #
    # The group only serialises them, though - it cannot order them, because these
    # jobs queue in the order their tests happen to finish, not in commit order. So
    # the group is half the fix and the ancestry guard in the ship step is the other
    # half: the lock makes reading the box and then shipping to it safe from anyone
    # else's deploy, and the guard refuses to move production backwards.
    #
    # cancel-in-progress stays false because abandoning a half-swapped stack is worse
    # than waiting out the deploy in front of it. A deploy still *pending* when a
    # newer one queues is dropped rather than run - that is Actions keeping one
    # pending entry per group, and it is the right outcome here, since a dropped
    # commit's work is already inside the newer commit's tree.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ vars.ANCHOR_DEPLOY_USER }}@${{ vars.ANCHOR_DEPLOY_HOST }}
    steps:
      # Full history: the ancestry guard has to decide whether the commit on the box
      # is a descendant of this one, which a depth-1 checkout cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/kylekdang/anchor-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build and push the caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          push: true
          tags: ghcr.io/kylekdang/anchor-caddy:${{ github.sha }}
          build-args: VITE_SENTRY_DSN=${{ vars.ANCHOR_SENTRY_DSN_FRONTEND }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max
      # The smoke tooling is installed before anything ships, so a flaky download
      # can never fail the job after production has already changed.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Render the production .env
        # printf, not a heredoc: secret values land verbatim, never re-expanded by the shell.
        env:
          PUBLIC_URL: ${{ vars.ANCHOR_PUBLIC_URL }}
          MAIL_FROM: ${{ vars.ANCHOR_MAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.ANCHOR_RESEND_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.ANCHOR_POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.ANCHOR_SENTRY_DSN }}
          TMDB_ACCESS_TOKEN: ${{ secrets.ANCHOR_TMDB_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANCHOR_ANTHROPIC_API_KEY }}
        run: |
          printf '%s=%s\n' \
            ANCHOR_IMAGE_TAG "$GITHUB_SHA" \
            ANCHOR_PUBLIC_URL "$PUBLIC_URL" \
            ANCHOR_MAIL_FROM "$MAIL_FROM" \
            ANCHOR_RESEND_API_KEY "$RESEND_API_KEY" \
            ANCHOR_POSTGRES_PASSWORD "$POSTGRES_PASSWORD" \
            ANCHOR_SENTRY_DSN "$SENTRY_DSN" \
            ANCHOR_TMDB_ACCESS_TOKEN "$TMDB_ACCESS_TOKEN" \
            ANCHOR_ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" \
            > deploy/.env
      - name: Ship to the box and restart the stack
        env:
          SSH_KEY: ${{ secrets.ANCHOR_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.ANCHOR_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/anchor_deploy
          chmod 600 ~/.ssh/anchor_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Ordering, which the concurrency group cannot give on its own: a child's
          # tests can finish before its parent's, putting the parent second in the
          # queue and one `up` away from undoing the child. Nobody else can deploy
          # while this job holds the group, so reading the box and then acting on
          # what it said is safe. The rsync is inside the guard too - skipping the
          # `up` but leaving an older ANCHOR_IMAGE_TAG in the box's .env would arm
          # a downgrade for whatever ran compose there next.
          if .github/scripts/box-serves-this-commit.sh "$TARGET" "$GITHUB_SHA"; then
            echo "a newer commit got here first; leaving production alone"
            exit 0
          fi
          # The prod Caddyfile is baked into the caddy image; a copy on the box would be dead.
          rsync -az --delete --delete-excluded --exclude=Caddyfile \
            -e "ssh -i ~/.ssh/anchor_deploy" deploy/ "$TARGET:/opt/anchor/"
          ssh -i ~/.ssh/anchor_deploy "$TARGET" \
            "cd /opt/anchor && docker compose pull -q && docker compose up -d --wait"
      - name: Check the box is serving this commit
        # The same question the guard asked, now as the assertion: whether this job
        # shipped or stood aside for a newer one, production must be at this commit
        # or ahead of it by the time the job goes green. This is what makes a green
        # deploy mean "this merge is live" without anyone curling production.
        run: .github/scripts/box-serves-this-commit.sh "$TARGET" "$GITHUB_SHA"
      - name: Wait for HTTPS to answer
        # Caddy fetches its certificate from Let's Encrypt on first boot for a name
        # it has not served before, which takes about a minute. compose's --wait does
        # not cover it: the caddy service has no healthcheck, so the container counts
        # as up long before TLS is serving. Poll instead of racing it.
        env:
          BASE_URL: ${{ vars.ANCHOR_PUBLIC_URL }}
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 10 "$BASE_URL/api/health"; then
              echo "answering over HTTPS after $attempt attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$BASE_URL did not answer over HTTPS within five minutes"
          exit 1
      - name: Smoke the live site
        # Only the skeleton journey: the auth journey reads mail out of the fake
        # Resend, which production (real Resend) deliberately does not have.
        run: npx playwright test e2e/skeleton.spec.ts
        working-directory: frontend
        env:
          ANCHOR_BASE_URL: ${{ vars.ANCHOR_PUBLIC_URL }}
      - name: Prune old images
        # Only after a green smoke, so the previous build stays on the box for a fast
        # rollback. Housekeeping cannot fail a deploy that already shipped and proved
        # itself: the step still goes red on its own, but the job does not.
        continue-on-error: true
        run: ssh -i ~/.ssh/anchor_deploy "$TARGET" "docker image prune -af --filter until=72h"
