x-app-environment: &app-environment
  ANCHOR_DATABASE_URL: postgresql://anchor:anchor@postgres:5432/anchor
  ANCHOR_PUBLIC_URL: ${ANCHOR_PUBLIC_URL:-http://localhost}
  # Mail goes to the fake Resend below; a real key and base URL are a deploy concern.
  ANCHOR_RESEND_BASE_URL: http://mail:8025
  ANCHOR_RESEND_API_KEY: dev
  # Likewise TMDB: the dev stack talks to the fake below, so it needs no credential.
  ANCHOR_TMDB_BASE_URL: http://tmdb:8030/3
  ANCHOR_TMDB_ACCESS_TOKEN: dev
  # And Anthropic: the fake below answers every operation, so the dev stack has a prose
  # profile and a stocked shelf, and the demo build can pass its own checks.
  ANCHOR_ANTHROPIC_BASE_URL: http://anthropic:8040
  ANCHOR_ANTHROPIC_API_KEY: dev
  # The per-IP auth limits are a production defence, and in-process, so re-running the
  # smoke suite inside one window exhausts them: every journey signs up and verifies,
  # and the window outlives the run. Dev and CI raise them rather than trip them.
  ANCHOR_SIGNUP_RATE_LIMIT: 100
  ANCHOR_VERIFY_RATE_LIMIT: 100

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: anchor
      POSTGRES_DB: anchor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${ANCHOR_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor -d anchor"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build:
      context: .
      target: app
    image: anchor-app
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: anchor-app
    # Caddy is the only client, so its forwarded headers name the real visitor (rate limits key on it).
    command: ["uvicorn", "anchor.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
      tmdb:
        condition: service_started
    # /api/health passes only when the database and the worker answer too, so "web healthy"
    # deliberately means "the whole stack answers": `docker compose up --wait` waits for all of it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  worker:
    image: anchor-app
    command: ["python", "-m", "anchor.worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      anthropic:
        condition: service_started

  demo:
    # The demo account, rebuilt from the checked-in fixture on every `up`: the replay goes
    # through the web app in-process and waits on the worker for the jobs, so it starts
    # once the stack answers and finishes on its own time. `docker compose wait demo`
    # blocks until it has, and relays its exit code (the smoke suite does exactly that).
    image: anchor-app
    command: ["python", "-m", "anchor.demobuild"]
    environment: *app-environment
    restart: "no"
    depends_on:
      web:
        condition: service_healthy

  mail:
    # Resend's HTTP API, faked: dev and test never send real mail. Read what was sent
    # at http://localhost:8025/emails.
    image: python:3.13-alpine
    command: ["python", "/fake_resend.py"]
    volumes:
      - ./backend/tools/fake_resend.py:/fake_resend.py:ro
    ports:
      - "${ANCHOR_MAIL_PORT:-8025}:8025"

  tmdb:
    # TMDB's HTTP API, faked over a fixed handful of films: the dev stack works
    # without a credential, and the browser smoke suite stays deterministic.
    image: python:3.13-alpine
    command: ["python", "/fake_tmdb.py"]
    volumes:
      - ./backend/tools/fake_tmdb.py:/fake_tmdb.py:ro
      # The demo fixture's films, so the demo build's import matches every one of them.
      - ./backend/src/anchor/demofixture.json:/demofixture.json:ro

  anthropic:
    # Anthropic's Messages API, faked: canned prose, a ranking that keeps the list it was
    # given, and a stable few tags per film. No credential, no spend, deterministic.
    image: python:3.13-alpine
    command: ["python", "/fake_anthropic.py"]
    volumes:
      - ./backend/tools/fake_anthropic.py:/fake_anthropic.py:ro

  caddy:
    build:
      context: .
      target: caddy
    image: anchor-caddy
    ports:
      - "${ANCHOR_HTTP_PORT:-80}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
